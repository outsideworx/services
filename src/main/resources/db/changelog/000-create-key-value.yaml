databaseChangeLog:
  - changeSet:
      id: 000-create-key-value
      author: services
      comment: Creates the key_value table for outsideworx key-value pairs
      changes:
        - sql:
            sql: |
              CREATE SEQUENCE IF NOT EXISTS key_value_seq START WITH 1 INCREMENT BY 50;
              CREATE TABLE IF NOT EXISTS key_value (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                name VARCHAR(255),
                value VARCHAR(255)
              );
