databaseChangeLog:
  - changeSet:
      id: 000-create-tunnel
      author: services
      comment: Creates the tunnel table for outsideworx operator key-value pairs
      changes:
        - sql:
            sql: |
              CREATE SEQUENCE IF NOT EXISTS tunnel_seq START WITH 1 INCREMENT BY 50;
              CREATE TABLE IF NOT EXISTS tunnel (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                name VARCHAR(255),
                value VARCHAR(255)
              );
