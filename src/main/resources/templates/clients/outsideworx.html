<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outside Worx</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="mb-3 d-flex align-items-center">
        <div class="ms-auto d-flex align-items-center gap-3">
            <div class="d-flex align-items-center gap-1">
                <span class="text-secondary">Analytics:</span>
                <a th:href="@{'/grafana'}" target="_blank">
                    <img src="/img/grafana.svg" width="32" alt="">
                </a>
            </div>
            <div class="d-flex align-items-center gap-1">
                <span class="text-secondary">Notifications:</span>
                <a th:href="@{'/ntfy'}" target="_blank">
                    <img src="/img/ntfy.svg" width="32" alt="">
                </a>
            </div>
            <a th:href="@{'/logout'}" class="btn btn-outline-secondary">
                <i class="bi bi-box-arrow-right me-1"></i>
                Logout
            </a>
        </div>
    </div>
    <div class="text-center mt-5">
        <h1>Hello World</h1>
    </div>
</div>
</body>
</html>
